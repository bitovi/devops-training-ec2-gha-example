name: Lambda Deploy Documents Created

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string
      destroy:
        description: 'Destroy the Terraform stack'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        type: choice
        options:
          - staging
          - production
      destroy:
        description: 'Destroy the Terraform stack'
        required: false
        type: boolean
        default: false
  
env:
  TF_STATE_BUCKET: aa-infra-bucket-tf-state
jobs:
  terraform:
    name: ${{ inputs.destroy && 'Destroy' || 'Deploy' }} Lambda
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_ENDPOINT: ${{ vars.API_ENDPOINT }}
    defaults:
      run:
        working-directory: infra/ecs/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.2'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Terraform state file bucket (if not exists)
        if: ${{ !inputs.destroy }}
        run: |
          ../scripts/create-bucket.sh

      - name: Create terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region = "${{ env.AWS_REGION }}"
          environment = "${{ inputs.environment }}"
          bucket_name = "${{ env.FILES_BUCKET }}"
          tf_state_bucket = "${{ env.TF_STATE_BUCKET }}"
          lambda_runtime = "${{ env.LAMBDA_RUNTIME }}"
          EOF

      - name: Substitute environment variables in Terraform files
        run: |
          envsubst < main.tf > main.tf.tmp && mv main.tf.tmp main.tf

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=lambda/${{ inputs.environment }}/terraform.tfstate"

      - name: Terraform Plan
        if: ${{ !inputs.destroy }}
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out="tfplan-${{ inputs.environment }}"

      - name: Terraform Apply
        if: ${{ !inputs.destroy }}
        run: |
          terraform apply -auto-approve tfplan-${{ inputs.environment }}

      - name: Terraform Destroy
        if: ${{ inputs.destroy }}
        run: |
          terraform destroy -auto-approve

      - name: Get Terraform outputs
        if: ${{ !inputs.destroy }}
        id: outputs
        run: |
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "eventbridge_rule_name=$(terraform output -raw eventbridge_rule_name)" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        if: ${{ !inputs.destroy }}
        run: |
          echo "🚀 Lambda deployment completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "📋 Deployment Details:" >> $GITHUB_STEP_SUMMARY
          echo "  - Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "  - Lambda Function: ${{ steps.outputs.outputs.lambda_function_name }}" >> $GITHUB_STEP_SUMMARY
          echo "  - S3 Bucket: ${{ steps.outputs.outputs.s3_bucket_name }}" >> $GITHUB_STEP_SUMMARY
          echo "  - EventBridge Rule: ${{ steps.outputs.outputs.eventbridge_rule_name }}" >> $GITHUB_STEP_SUMMARY
          echo "  - AWS Region: ${{ env.AWS_REGION }} ">> $GITHUB_STEP_SUMMARY

      - name: Destruction Summary
        if: ${{ inputs.destroy }}
        run: |
          echo "💥 Destruction completed!" >> $GITHUB_STEP_SUMMARY

