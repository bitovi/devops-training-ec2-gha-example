name: Simple-Grafana-Stack deploy
on:
  push:
    branches: [ simple-grafana-stack ]

jobs:
  Simple-Grafana-Stack-Deploy:
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: bitovi/github-actions-deploy-docker-to-ec2@main
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_r53_enable: false
          #aws_r53_domain_name: bitovi-sandbox.com
          #aws_r53_sub_domain_name: sd2ec2
          #aws_r53_create_sub_cert: true

          aws_elb_create: false
          tf_stack_destroy: false
          tf_state_bucket_destroy: true 

          aws_ec2_instance_root_vol_size: 30
          aws_ec2_instance_type: t3.medium
          aws_ec2_port_list: 9090,3100,3200,3000,4317,4318
          #aws_ec2_allowed_cidr: 
          #ansible_skip: false