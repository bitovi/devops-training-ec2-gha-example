#image: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image_tag }}",

      - name: Templetize ECS container definition JSON file
        run: |
          jq '.[] |= . + {
            name: "${{ env.SERVICE_NAME }}-${{ inputs.environment }}",
            cpu: ${{ env.CPU }},
            memory: ${{ env.MEMORY }},
            environment: (
              .environment + [
                { "name": "ENVIRONMENT2", "value": "${{ inputs.environment }}" }
              ]
            ),
            logConfiguration: (
              .logConfiguration + {
                options: (
                  .logConfiguration.options + {
                    "awslogs-group": "/ecs/${{ env.SERVICE_NAME }}/${{ inputs.environment }}",
                    "awslogs-region": "us-east-1",
                  }
                )
              }
            )
          }' task-definition2.json > task-definition2.new.json
          echo "####################################"
          echo "Templatized worker task definition:"
          echo "####################################"
          cat task-definition2.new.json

