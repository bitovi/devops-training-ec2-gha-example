name: Deploy to Amazon ECS

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        type: string
      environment:
        description: 'Environment to run tests against'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        type: string
      environment:
        description: 'Environment to run tests against'
        type: choice
        options:
          - staging
          - production
        default: staging
      tf_stack_destroy:
        description: 'Whether to destroy the Terraform stack'
        required: true
        type: boolean
        default: false

env:
  SERVICE_NAME: test-world
  ECR_REPOSITORY: bitovi-devops-training-ec2-gha-example-simple-ecr-ecr
  IMAGE_TAG: "${{ inputs.environment }}-${{ inputs.image_tag }}"

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws-region: us-east-1

#      - name: Login to Amazon ECR
#        id: login-ecr
#        uses: aws-actions/amazon-ecr-login@v2
#
#      - name: Build, tag, and push image to Amazon ECR
#        id: build-image
#        env:
#          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
#        run: |
#          # Build a docker container and push it to ECR
#          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
#
#          # Push both tags
#          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
#
#          # Output the image reference
#          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy using GHA
        uses: bitovi/github-actions-deploy-ecs@ignore-task-defn
        id: create-1
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1
          aws_resource_identifier: "${{ env.SERVICE_NAME }}-${{ inputs.environment }}"
          checkout: false

          aws_ecs_task_cpu: 512
          aws_ecs_task_mem: 1024
          tf_stack_destroy: false
          tf_state_bucket_destroy: true 
          aws_ecs_task_ignore_definition: true
          #aws_ecs_app_image: "${{ steps.build-image.outputs.image }}"
          aws_ecs_assign_public_ip: true

          aws_ecs_container_port: 80
          aws_ecs_lb_port: 443
          aws_ecs_lb_redirect_enable: true

          aws_ecs_cloudwatch_enable: false
          aws_ecs_cloudwatch_retention_days: 1

          aws_waf_enable: true

          aws_r53_enable: true
          aws_r53_domain_name: "bitovi-sandbox.com"
          aws_r53_sub_domain_name: devops-training-example-ecs
          aws_r53_enable_cert: true
          aws_r53_create_sub_cert: true

          env_ghv: |
            ENVIRONMENT=${{ inputs.environment }}