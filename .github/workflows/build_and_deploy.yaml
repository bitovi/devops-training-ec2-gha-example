jobs:
  deploy-worker:
    name: Deploy ECS Container
    runs-on: ubuntu-latest
    if: false
    environment: 
      name: ${{ inputs.environment }}
    env:
      TASK_CPU: 250
      TASK_MEM: 2048
    steps:
      - name: Deploy using GHA
        if: false
        #uses: bitovi/github-actions-deploy-ecs@v1
        uses: bitovi/github-actions-deploy-ecs@v1
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1
          #aws_resource_identifier: "${{ env.SERVICE_NAME }}-${{ inputs.environment }}"
          checkout: false
          aws_ecs_task_cpu: 1024
          aws_ecs_task_mem: 2048
          #aws_ecs_app_image: "nginx:alpine"
          #aws_ecs_app_image: "nginx:otel"
          aws_ecs_app_image: "hashicorp/http-echo"
         
          #aws_ecs_task_name: "${{ env.SERVICE_NAME }}-${{ inputs.environment }}"
          tf_stack_destroy: false # true
          tf_state_bucket_destroy: false 
        
          aws_ecs_task_ignore_definition: false
          aws_ecs_assign_public_ip: true
          aws_ecs_node_count: 1
          #aws_ecs_task_execution_role: "ecs-leo"
        
          aws_ecs_container_port: 5678
          aws_ecs_lb_port: 5678
          aws_ecs_lb_www_to_apex_redirect: true
          aws_r53_enable: true
          aws_r53_domain_name: "bitovi-sandbox.com"
          aws_r53_sub_domain_name: devops-training-example-ecs
          aws_r53_enable_cert: false
          #aws_r53_create_sub_cert: true

          aws_ecs_lb_redirect_enable: true
          aws_r53_root_domain_deploy: true
          aws_ecs_cloudwatch_enable: false

