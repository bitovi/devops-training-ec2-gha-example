name: Deploy to Amazon ECS

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        type: string
      environment:
        description: 'Environment to run tests against'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        type: string
      environment:
        description: 'Environment to run tests against'
        type: choice
        options:
          - staging
          - production
        default: staging
      tf_stack_destroy:
        description: 'Whether to destroy the Terraform stack'
        required: true
        type: boolean
        default: false

env:
  SERVICE_NAME: test-world
  ECR_REPOSITORY: bitovi-devops-training-ec2-gha-example-simple-ecr-ecr
  IMAGE_TAG: "${{ inputs.environment }}-${{ inputs.image_tag }}"
  CPU: 256
  MEMORY: 512

permissions:
  contents: read

jobs:
  ECS-Mana:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws-region: us-east-1

#      - name: Login to Amazon ECR
