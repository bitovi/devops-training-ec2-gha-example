name: Deploy to Amazon ECS

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        type: string
      environment:
        description: 'Environment to run tests against'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        type: string
      environment:
        description: 'Environment to run tests against'
        type: choice
        options:
          - staging
          - production
        default: staging
      tf_stack_destroy:
        description: 'Whether to destroy the Terraform stack'
        required: true
        type: boolean
        default: false
 
env:
  SERVICE_NAME: test-world
  ECR_REPOSITORY: bitovi-devops-training-ec2-gha-example-simple-ecr-ecr
  IMAGE_TAG: "${{ inputs.environment }}-${{ inputs.image_tag }}"
  CPU: 256
  MEMORY: 512

permissions:
  contents: read 

concurrency:
      group: group
      cancel-in-progress: false

