name: Lambda Staging Deployment

on:
  pull_request:
    branches: [staging]
    types: [closed]
    paths:
      - ".github/workflows/lambda.*"
      - "packages/lambda/**"
  workflow_dispatch:
    inputs:
      tf_stack_destroy:
        description: 'Destroy the Terraform stack'
        required: false
        type: boolean
        default: false

  push:
    branches: [ simple-lambda ]
jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/lambda.run-tests.yaml
    with:
      environment: staging
    secrets: inherit
      
  deploy:
    name: Deploy Lambda
    uses: ./.github/workflows/lambda.deploy.yaml
    needs:
      - test
    with:
      environment: staging
      destroy: true
    secrets: inherit
    concurrency:
      group: lambda-staging-deployment
      cancel-in-progress: true
