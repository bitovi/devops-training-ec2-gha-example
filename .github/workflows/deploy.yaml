name: Ollama Advanced deploy
on:
  push:
    branches: [ ollama ]
    
jobs:
  Ollama-Deploy:
    runs-on: ubuntu-latest
    steps:
    - id: deploy
      name: Deploy
      uses: bitovi/github-actions-deploy-ollama@upgrade-to-latest
      with:
        disable_signup: true
        ollama_models: "phi3,qwen:0.5b,tinyllama,deepseek-r1"
        
        aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
        aws_default_region: us-east-1

        aws_r53_enable: true
        aws_r53_domain_name: bitovi-sandbox.com
        aws_r53_sub_domain_name: ollama
        aws_r53_create_sub_cert: true

        ansible_start_docker_timeout: 600

        docker_cloudwatch_enable: true
        docker_cloudwatch_retention_days: 7
