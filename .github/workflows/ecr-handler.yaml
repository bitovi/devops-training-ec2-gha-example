name: simple-ecr
on:
  workflow_dispatch:
    inputs:
      tf_stack_destroy:
        description: 'Destroy the Terraform stack'
        required: false
        type: boolean
        default: true
      aws_ecr_repo_name:
        description: 'Name of the ECR repository'
        required: true
        type: string
        default: ecr-repo
  push:
    branches: [ simple-storybook ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - id: build-publish
      uses: bitovi/github-actions-storybook-to-github-pages@main
      with:
        path: build # change to your build folder