name: Simple-D2EC2 deploy
on:
  push:
    branches: [ simple-d2ec2 ]

env:
  TF_DESTROY: 'false'

jobs:
  Destroy-D2EC2-Deploy:
    runs-on: ubuntu-latest
    if: false == true
    steps:
      - id: elb
        uses: bitovi/github-actions-deploy-docker-to-ec2@v1
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_r53_enable: false
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro
          aws_elb_app_port: 80
          aws_elb_create: true
          #aws_lb_type: alb
          #aws_alb_enable_waf: false
          tf_stack_destroy: true

  Destroy-D2EC2-Deploy-new:
    runs-on: ubuntu-latest
    if: false == true
    steps:
      - id: deploy-new0
        uses: bitovi/github-actions-deploy-docker-to-ec2@commons-testing
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_resource_identifier: new-alb-and-waf-to-ec2

          aws_r53_enable: false
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2n
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro
          aws_elb_app_port: 80
          #aws_lb_type: alb
          #aws_alb_enable_waf: false
          tf_stack_destroy: true

  Test-3rd-D2EC2-Deploy-new2:
    runs-on: ubuntu-latest
    if: false == true
    steps:
      - id: deploy-new0
        uses: bitovi/github-actions-deploy-docker-to-ec2@commons-testing
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_resource_identifier: new-alb-and-waf-to-ec2-3

          aws_r53_enable: false
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2n-3
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro
          aws_elb_app_port: 80
          #aws_lb_type: alb
          #aws_alb_enable_waf: false
          tf_stack_destroy: true
          tf_state_bucket_destroy: true

  Simple-D2EC2-Deploy:
    runs-on: ubuntu-latest
    if: false == false
    steps:
      - id: elb
        name: Deploy without R53
        uses: bitovi/github-actions-deploy-docker-to-ec2@v1
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_r53_enable: false
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro
          aws_elb_app_port: 80
          aws_elb_create: true
          #aws_lb_type: alb
          #aws_alb_enable_waf: false
          tf_stack_destroy: false

      - id: elb-r53
        name: Deploy with R53
        uses: bitovi/github-actions-deploy-docker-to-ec2@v1
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_r53_enable: true
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro
          aws_elb_app_port: 80
          aws_elb_create: true
          #aws_lb_type: alb
          #aws_alb_enable_waf: false
          tf_stack_destroy: false

      - id: elb-no-r53
        name: Deploy with ELB and R53
        uses: bitovi/github-actions-deploy-docker-to-ec2@commons-testing
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_r53_enable: true
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro
          aws_elb_app_port: 80
          aws_elb_create: true
          #aws_lb_type: alb
          #aws_alb_enable_waf: false
          tf_stack_destroy: false

      - id: no-elb-no-r53
        name: Deploy with ELB and remove R53
        uses: bitovi/github-actions-deploy-docker-to-ec2@commons-testing
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_r53_enable: false
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro
          aws_elb_app_port: 80
          aws_elb_create: true
          #aws_lb_type: alb
          #aws_alb_enable_waf: false
          tf_stack_destroy: false

      - id: r53-yes-no-elb
        name: Deploy with R53 and remove ELB
        uses: bitovi/github-actions-deploy-docker-to-ec2@commons-testing
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_r53_enable: true
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro
          aws_elb_app_port: 80
          aws_elb_create: false
          aws_alb_create: true
          aws_alb_app_port: 80
          #aws_lb_type: alb
          aws_waf_enable: true
          tf_stack_destroy: false

      - id: r53-yes-no-elb2
        name: Deploy with R53 and remove ELB (alternate)
        uses: bitovi/github-actions-deploy-docker-to-ec2@commons-testing
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_r53_enable: true
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro
          aws_elb_app_port: 80
          aws_elb_create: false
          #aws_lb_type: alb
          #aws_alb_enable_waf: false
          tf_stack_destroy: false

  Simple-D2EC2-Deploy-new:
    runs-on: ubuntu-latest
    if: false == true
    steps:
      - id: deploy-new0
        name: Deploy without R53
        uses: bitovi/github-actions-deploy-docker-to-ec2@commons-testing
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_resource_identifier: new-alb-and-waf-to-ec2

          aws_r53_enable: false
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2n
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro
          aws_elb_app_port: 80

      - id: deploy-r53
        name: Deploy with R53
        uses: bitovi/github-actions-deploy-docker-to-ec2@commons-testing
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_resource_identifier: new-alb-and-waf-to-ec2

          aws_r53_enable: true
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2n
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro

          aws_elb_create: false
          aws_elb_app_port: 80

      - id: deploy-r53-enable-elb
        name: Deploy with R53 and ELB
        uses: bitovi/github-actions-deploy-docker-to-ec2@commons-testing
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_resource_identifier: new-alb-and-waf-to-ec2

          aws_r53_enable: true
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2n
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro

          aws_elb_create: true
          aws_elb_app_port: 80

      - id: deploy-r53-enable-alb
        name: Deploy with R53 and ALB
        uses: bitovi/github-actions-deploy-docker-to-ec2@commons-testing
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_resource_identifier: new-alb-and-waf-to-ec2

          aws_r53_enable: true
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2n
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro
          aws_elb_app_port: 80
          aws_elb_create: true
          aws_alb_create: true
          aws_alb_app_port: 80

      - id: deploy-r53-enable-alb-waf
        name: Deploy with R53, ALB, and WAF
        uses: bitovi/github-actions-deploy-docker-to-ec2@commons-testing
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1

          aws_resource_identifier: new-alb-and-waf-to-ec2

          aws_r53_enable: false
          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: sd2ec2n
          aws_r53_create_sub_cert: true

          aws_ec2_instance_type: t3.micro

          tf_stack_destroy: false

          aws_elb_app_port: 80
          aws_elb_create: false
          aws_alb_create: true
          aws_alb_app_port: 80

          aws_waf_enable: true
          aws_waf_logging_enable: false
          aws_waf_rule_anonymous_ip: true