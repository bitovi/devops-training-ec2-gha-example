name: Deploy Cluster
on:
    push:
      branches: [pure-eks]

jobs:
  Deploy-Cluster:
    runs-on: ubuntu-latest
    steps:
    - name: Create EKS Cluster
      uses: bitovi/github-actions-deploy-eks@commons-testing
      with:
        aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
        aws_eks_cluster_name: bitovi-eks-example
        tf_state_bucket: bitovi-eks-example-terraform-state
        aws_eks_instance_type: t3.medium
        aws_eks_instance_ami_type: AL2023_x86_64_STANDARD
        tf_stack_destroy: false
        tf_state_bucket_destroy: true
        aws_eks_cluster_version: 1.34
        aws_eks_create_bk_node_group: true
        aws_eks_instance_type_bk: t3.large
        aws_eks_instance_ami_type_bk: AL2023_x86_64_STANDARD