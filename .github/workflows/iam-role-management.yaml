name: IAM Role Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (create or delete)"
        required: true
        default: create
        type: choice
        options:
          - create
          - delete
      environment:
        description: "Environment name (used as suffix for role names)"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
  push:
    branches: [main, simple-ecr-ecs-dockerfile]

jobs:
  manage-roles:
    runs-on: ubuntu-latest
    outputs:
      execution_role_arn: ${{ steps.output-arns.outputs.execution_role_arn }}
      task_role_arn: ${{ steps.output-arns.outputs.task_role_arn }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws-region: us-east-1   # change as needed

      - name: Manage IAM Roles
        id: manage
        run: |
          ACTION="create"
          ENV="staging"
          EXEC_ROLE="ecsTaskExecutionRole-$ENV"
          TASK_ROLE="ecsTaskRole-$ENV"

          if [ "$ACTION" = "create" ]; then
            echo "==== Creating or ensuring roles exist for $ENV ===="

            # --- Execution Role ---
            if ! aws iam get-role --role-name "$EXEC_ROLE" >/dev/null 2>&1; then
              aws iam create-role \
                --role-name "$EXEC_ROLE" \
                --assume-role-policy-document '{
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": { "Service": "ecs-tasks.amazonaws.com" },
                      "Action": "sts:AssumeRole"
                    }
                  ]
                }'
            fi

            # Attach execution policy if not present
            if ! aws iam list-attached-role-policies --role-name "$EXEC_ROLE" \
              | grep -q "AmazonECSTaskExecutionRolePolicy"; then
              aws iam attach-role-policy \
                --role-name "$EXEC_ROLE" \
                --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
            fi

            # --- Task Role ---
            if ! aws iam get-role --role-name "$TASK_ROLE" >/dev/null 2>&1; then
              aws iam create-role \
                --role-name "$TASK_ROLE" \
                --assume-role-policy-document '{
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": { "Service": "ecs-tasks.amazonaws.com" },
                      "Action": "sts:AssumeRole"
                    }
                  ]
                }'
            fi

            echo "Roles ensured for $ENV"

          elif [ "$ACTION" = "delete" ]; then
            echo "==== Deleting roles for $ENV ===="

            # --- Execution Role ---
            if aws iam get-role --role-name "$EXEC_ROLE" >/dev/null 2>&1; then
              for POLICY in $(aws iam list-attached-role-policies --role-name "$EXEC_ROLE" \
                --query 'AttachedPolicies[].PolicyArn' --output text); do
                aws iam detach-role-policy --role-name "$EXEC_ROLE" --policy-arn "$POLICY"
              done
              aws iam delete-role --role-name "$EXEC_ROLE"
            fi

            # --- Task Role ---
            if aws iam get-role --role-name "$TASK_ROLE" >/dev/null 2>&1; then
              for POLICY in $(aws iam list-attached-role-policies --role-name "$TASK_ROLE" \
                --query 'AttachedPolicies[].PolicyArn' --output text); do
                aws iam detach-role-policy --role-name "$TASK_ROLE" --policy-arn "$POLICY"
              done
              aws iam delete-role --role-name "$TASK_ROLE"
            fi

            echo "Roles deleted for $ENV"
          else
            echo "Invalid action: $ACTION"
            exit 1
          fi

      - name: Output ARNs
        id: output-arns
        if: inputs.action == 'create'
        run: |
          ENV="${{ inputs.environment }}"
          EXEC_ROLE="ecsTaskExecutionRole-$ENV"
          TASK_ROLE="ecsTaskRole-$ENV"

          EXEC_ARN=$(aws iam get-role --role-name "$EXEC_ROLE" --query 'Role.Arn' --output text)
          TASK_ARN=$(aws iam get-role --role-name "$TASK_ROLE" --query 'Role.Arn' --output text)

          echo "execution_role_arn=$EXEC_ARN" >> $GITHUB_OUTPUT
          echo "task_role_arn=$TASK_ARN" >> $GITHUB_OUTPUT

          echo "Execution Role ARN: $EXEC_ARN"
          echo "Task Role ARN: $TASK_ARN"
