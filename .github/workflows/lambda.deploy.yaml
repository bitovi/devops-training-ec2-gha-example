name: Lambda Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: "us-east-1"
      API_ENDPOINT: "https://miranda-cymoid-veronica.ngrok-free.app"
      TF_STATE_BUCKET: leo-uploaded-documents-bucket-tf-state
      FILES_BUCKET: "leo-uploaded-documents-${{ inputs.environment }}"
    defaults:
      run:
        working-directory: packages/lambda/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.2'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Terraform state file bucket (if not exists)
        run: |
          ../scripts/create-bucket.sh

      - name: Debug variables
        run: |
          echo "AWS_REGION=${{ env.AWS_REGION }}"
          echo "ENVIRONMENT=${{ inputs.environment }}"
          echo "API_ENDPOINT=${{ env.API_ENDPOINT }}"
          echo "TF_STATE_BUCKET=${{ env.TF_STATE_BUCKET }}"

      - name: Create terraform.tfvars
        run: |
          AWS_REGION="${{ env.AWS_REGION }}"
          ENVIRONMENT="${{ inputs.environment }}"
          API_ENDPOINT="${{ env.API_ENDPOINT }}"
          TF_STATE_BUCKET="${{ env.TF_STATE_BUCKET }}"
          cat > terraform.tfvars <<EOF
          aws_region = "$AWS_REGION"
          environment = "$ENVIRONMENT"
          api_endpoint = "$API_ENDPOINT"
          bucket_name = "swp-uploaded-documents-$ENVIRONMENT"
          tf_state_bucket = "$TF_STATE_BUCKET"
          EOF

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=lambda/${{ inputs.environment }}/terraform.tfstate"

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out="tfplan-${{ inputs.environment }}"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve tfplan-${{ inputs.environment }}

      - name: Get Terraform outputs
        id: outputs
        run: |
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "eventbridge_rule_name=$(terraform output -raw eventbridge_rule_name)" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "🚀 Lambda deployment completed successfully!"
          echo "📋 Deployment Details:"
          echo "  - Environment: ${{ inputs.environment }}"
          echo "  - Lambda Function: ${{ steps.outputs.outputs.lambda_function_name }}"
          echo "  - S3 Bucket: ${{ steps.outputs.outputs.s3_bucket_name }}"
          echo "  - EventBridge Rule: ${{ steps.outputs.outputs.eventbridge_rule_name }}"
          echo "  - AWS Region: ${{ env.AWS_REGION }}"


