  deploydb:
    runs-on: ubuntu-latest
    steps:
    - id: deploy-rds
      uses: bitovi/github-actions-deploy-rds@v0.1.7
      with:
        aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
        aws_default_region: us-east-1
        aws_rds_db_publicly_accessible: true
        aws_rds_db_enable: true

  deploy:
    runs-on: self-hosted
    steps:
      - name: Apply SQL files
        uses: bitovi/github-actions-apply-sql-files-to-postgres@v0
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1 
          aws_secret_name: ${{ steps.deploydb.outputs.db_secret_details_name }}
          sql_scripts_path: sql-files
          db_host:	${{ steps.deploydb.outputs.db_endpoint }}
          db_port: 5432
