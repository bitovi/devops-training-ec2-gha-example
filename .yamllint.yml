# YAML Linting Configuration
# See: https://yamllint.readthedocs.io/en/stable/configuration.html

extends: default

rules:
  # Lines can be longer than 180 characters for readability
  line-length:
    max: 180
    level: warning

  # Allow empty values in mappings (useful for Kubernetes manifests)
  empty-values:
    forbid-in-block-mappings: false
    forbid-in-flow-mappings: false

  # Allow truthy values like "yes", "no", "on", "off"
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
    check-keys: false

  # Relaxed indentation rules for complex nested structures
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

  # Allow trailing spaces (sometimes needed in YAML)
  trailing-spaces:
    level: warning

  # Comments don't need to start with a space
  comments:
    min-spaces-from-content: 1

  # Allow document start markers to be optional
  document-start:
    present: false

ignore: |
  # Ignore generated or external files